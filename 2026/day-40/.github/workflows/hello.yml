# on: Trigger to run the workflow
# jobs: Building blocks of a workflow, containing one or more steps
# runs-on: Specific the name of the runner either self-hosted or Github runner
# steps: Mentions steps to run on the runner
# uses: Pre-built and reusable actions
# run: Commands to run for the given steps
# name: Name of the steps

name: Hello 
on: push
jobs:
    greet:
        name: Greet
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 
              uses: actions/checkout@v7
            - name: Print 
              run: echo "Hello from GitHub Actions!"
            - name: Print Date and Time
              run: date  # added datesss to break the workflow
            - name: Print the name of the branch that triggered the run
              run: echo ${{ github.ref_name }} 
            - name: List the fiels in repo 
              run: ls -lrta
            - name: Print the runner operating system
              run: cat /etc/os-release
